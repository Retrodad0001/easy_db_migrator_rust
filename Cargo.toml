[package]
name = "easy_db_migrator_rust"
version = "1.0.0"
edition = "2024"
description = "A lightweight, plain-SQL database migration library for PostgreSQL and SQL Server."
license = "MIT"
repository = "https://github.com/Retrodad0001/easy_db_migrator_rust"
readme = "README.md"
keywords = ["migration", "database", "postgres", "sqlserver", "sql", "Rust", "rust-lang"]
categories = ["database"]
publish = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[lints.rust]
missing_docs = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"
match_wildcard_for_single_variants = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
indexing_slicing = "deny"

[dependencies]
chrono = "0.4.45"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "chrono"] }
thiserror = "2.0.19"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "chrono", "native-tls"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "net"] }
tokio-util = { version = "0.7.19", features = ["compat"] }
tracing = "0.1.44"

[dev-dependencies]
rand = "0.10.2"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "mssql_server"] }
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }

