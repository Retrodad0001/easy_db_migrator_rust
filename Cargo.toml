[package]
name = "easy_db_migrator_rust"
version = "1.0.3"
edition = "2024"
description = "A lightweight, plain-SQL database migration library for PostgreSQL and SQL Server."
license = "MIT"
repository = "https://github.com/Retrodad0001/easy_db_migrator_rust"
readme = "README.md"
keywords = ["migration", "database", "postgres", "sqlserver", "sql", "Rust", "rust-lang"]
categories = ["database"]
publish = false

[features]
postgres = ["dep:sqlx"]
mssql = ["dep:tiberius", "dep:tokio-util", "tokio/net"]
dhat-heap = []

[dependencies]
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "time"], optional = true }
thiserror = "2.0.21"
tiberius = { version = "0.12.3", default-features = false, features = ["tds73", "time", "native-tls"], optional = true }
time = "0.3.55"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = { version = "0.7.19", features = ["compat"], optional = true }
tracing = "0.1.44"

[dev-dependencies]
dhat = "0.3.3"
testcontainers = "0.28.0"
tracing-test = { version = "0.2.6", features = ["no-env-filter"] }

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"
required-features = ["postgres", "mssql"]

[[example]]
name = "profile_migrations"
path = "profiling/profile_migrations.rs"
required-features = ["postgres", "mssql"]

[lints.rust]
unused = { level = "deny", priority = -1 }
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"
unused_must_use = "deny"
unused_extern_crates = "deny"
unused_lifetimes = "deny"
redundant_lifetimes = "deny"
unused_macro_rules = "deny"
unused_qualifications = "deny"
redundant_imports = "deny"
unfulfilled_lint_expectations = "deny"
absolute_paths_not_starting_with_crate = "deny"
ambiguous_negative_literals = "deny"
closure_returning_async_block = "deny"
deprecated_in_future = "deny"
deprecated_safe_2024 = "deny"
deref_into_dyn_supertrait = "deny"
edition_2024_expr_fragment_specifier = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
ffi_unwind_calls = "deny"
if_let_rescope = "deny"
impl_trait_overcaptures = "deny"
impl_trait_redundant_captures = "deny"
keyword_idents_2018 = "deny"
keyword_idents_2024 = "deny"
let_underscore_drop = "deny"
linker_info = "deny"
macro_use_extern_crate = "deny"
meta_variable_misuse = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
missing_unsafe_on_extern = "deny"
non_ascii_idents = "deny"
raw_borrows_via_references = "deny"
rust_2021_incompatible_closure_captures = "deny"
rust_2021_incompatible_or_patterns = "deny"
rust_2021_prefixes_incompatible_syntax = "deny"
rust_2021_prelude_collisions = "deny"
rust_2024_guarded_string_incompatible_syntax = "deny"
rust_2024_incompatible_pat = "deny"
rust_2024_prelude_collisions = "deny"
single_use_lifetimes = "deny"
tail_expr_drop_order = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"
unnameable_types = "deny"
unsafe_attr_outside_unsafe = "deny"
unsafe_op_in_unsafe_fn = "deny"
unstable_features = "deny"
unused_crate_dependencies = "deny"
unused_import_braces = "deny"
unused_results = "deny"
variant_size_differences = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# contradicts unreachable_pub: that lint wants pub(crate) inside private modules
redundant_pub_crate = "allow"
# the duplicate versions come from dependencies, so this crate cannot remove them
multiple_crate_versions = "allow"
unwrap_used = "deny"
expect_used = "deny"
unwrap_in_result = "deny"
get_unwrap = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
wildcard_enum_match_arm = "deny"
wildcard_imports = "deny"
match_wildcard_for_single_variants = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
indexing_slicing = "deny"
exit = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
format_push_string = "deny"
implicit_clone = "deny"
inefficient_to_string = "deny"
iter_with_drain = "deny"
large_types_passed_by_value = "deny"
needless_collect = "deny"
needless_pass_by_value = "deny"
redundant_clone = "deny"
trivially_copy_pass_by_ref = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unused_self = "deny"
unused_async = "deny"
unnecessary_wraps = "deny"
print_stdout = "deny"
manual_let_else = "deny"
match_same_arms = "deny"
redundant_else = "deny"
semicolon_if_nothing_returned = "deny"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
incremental = false
debug = true

[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 16
