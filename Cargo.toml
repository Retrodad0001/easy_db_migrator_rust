[package]
name = "easy_db_migrator_rust"
version = "1.0.2"
edition.workspace = true
description = "A lightweight, plain-SQL database migration library for PostgreSQL and SQL Server."
license = "MIT"
repository = "https://github.com/Retrodad0001/easy_db_migrator_rust"
readme = "README.md"
keywords = ["migration", "database", "postgres", "sqlserver", "sql", "Rust", "rust-lang"]
categories = ["database"]
publish = false

[features]
postgres = ["dep:sqlx"]
mssql = ["dep:tiberius", "dep:tokio-util", "tokio/net"]

[dependencies]
chrono.workspace = true
sqlx = { workspace = true, optional = true }
thiserror.workspace = true
tiberius = { workspace = true, optional = true }
tokio = { workspace = true, features = ["time", "sync"] }
tokio-util = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
testcontainers.workspace = true
tracing-test.workspace = true

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

[lints]
workspace = true
