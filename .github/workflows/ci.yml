name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2

      - name: Install cargo-audit
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: cargo-audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@7572810d7dd469b651bb7793945692cf78da5dd7 # v2
        with:
          tool: cargo-deny

      - name: Run cargo audit
        run: cargo audit

      - name: Run cargo deny
        run: cargo deny check

      - name: Run Semgrep
        run: docker run --rm --entrypoint semgrep -v "${{ github.workspace }}:/src" -w /src semgrep/semgrep --config p/owasp-top-ten --config p/security-audit --config p/0xdea .

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run clippy (postgres backend only)
        run: cargo clippy --all-targets --no-default-features --features postgres -- -D warnings

      - name: Run clippy (mssql backend only)
        run: cargo clippy --all-targets --no-default-features --features mssql -- -D warnings

      - name: Check that no backend fails the build
        run: |
          if cargo check --no-default-features 2>/dev/null; then
            echo "expected --no-default-features to fail, but it built" >&2
            exit 1
          fi

      - name: Build docs
        run: cargo doc --no-deps

      - name: Build docs (postgres backend only)
        run: cargo doc --no-deps --no-default-features --features postgres

      - name: Build docs (mssql backend only)
        run: cargo doc --no-deps --no-default-features --features mssql

      - name: Run unit tests
        run: cargo test --lib

      - name: Run full test suite
        run: cargo test
